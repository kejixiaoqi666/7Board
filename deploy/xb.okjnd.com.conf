server {
    listen 80;
    listen [::]:80;
    server_name xb.okjnd.com;
    location ^~ /.well-known/acme-challenge/ { root /www/server/panel/vhost/nginx/well-known; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xb.okjnd.com;
    ssl_certificate /www/server/panel/vhost/cert/xb.okjnd.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/xb.okjnd.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:18120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}
