<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>7Board · Rust Canary</title>
<style>
:root{color-scheme:dark;font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif;background:#0b1220;color:#dbeafe}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0,#15294a 0,#0b1220 42%,#080d16 100%);min-height:100vh}.shell{max-width:1280px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:24px;font-weight:750;letter-spacing:.02em}.tag{color:#8ee7c5;background:#0b3a34;border:1px solid #146b5d;border-radius:999px;padding:4px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}.card{background:#101c30cc;border:1px solid #203654;border-radius:14px;padding:15px;box-shadow:0 10px 30px #0002}.label{color:#8da8c9;font-size:12px}.value{font-size:20px;margin-top:5px}.panel{background:#0d1829e8;border:1px solid #213754;border-radius:14px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #203654}.viewport{height:620px;overflow:auto;position:relative}.rows{position:relative}.row{height:42px;display:grid;grid-template-columns:80px 1.5fr 1fr 130px 130px;align-items:center;padding:0 18px;border-bottom:1px solid #172943;position:absolute;left:0;right:0}.row.head{position:sticky;top:0;background:#12223a;height:38px;z-index:2;position:relative;color:#9bb5d4;font-size:12px}.ok{color:#8ee7c5}.muted{color:#8da8c9}.foot{margin-top:16px;color:#7890ad;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#56e39f;margin-right:7px;box-shadow:0 0 12px #56e39f}.warn{color:#ffd479}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:55px 1.2fr .8fr 85px 75px;padding:0 10px;font-size:12px}.shell{padding:16px}}
</style>
</head>
<body><main class="shell"><div class="top"><div><div class="brand">7Board <span class="tag">Rust Canary</span></div><div class="muted">海量节点管理的低开销实时读模型预览</div></div><div id="conn" class="muted"><span class="dot"></span>连接初始化</div></div>
<section class="cards"><div class="card"><div class="label">运行时</div><div class="value">Rust / Tokio</div></div><div class="card"><div class="label">DOM 行数</div><div class="value">虚拟化 ≤ 72</div></div><div class="card"><div class="label">Redis 依赖</div><div class="value">可选 / 无强依赖</div></div><div class="card"><div class="label">数据状态</div><div id="db" class="value warn">影子未接管</div></div></section>
<section class="panel"><div class="panel-head"><div><strong>节点状态预览</strong><div class="muted">只渲染可视窗口；示例数据不会写入生产数据库</div></div><div id="tick" class="muted">等待 WS</div></div><div class="row head"><span>ID</span><span>节点</span><span>协议</span><span>状态</span><span>延迟</span></div><div id="viewport" class="viewport"><div id="rows" class="rows"></div></div></section>
<div class="foot">7Board canary · <a href="/healthz" style="color:#8ee7c5">healthz</a> · <a href="/readyz" style="color:#8ee7c5">readyz</a> · <a href="/api/v1/meta" style="color:#8ee7c5">meta</a></div></main>
<script>
(()=>{const total=100000,rowH=42,viewport=document.querySelector('#viewport'),rows=document.querySelector('#rows'),visible=()=>Math.ceil(viewport.clientHeight/rowH)+8;rows.style.height=(total*rowH)+'px';function render(){const start=Math.max(0,Math.floor(viewport.scrollTop/rowH)-4),end=Math.min(total,start+visible());let h='';for(let i=start;i<end;i++){const n=i+1;h+=`<div class="row" style="top:${i*rowH}px"><span>${n}</span><span>edge-${String(n).padStart(6,'0')}</span><span>${n%3?'VLESS':'TUIC'}</span><span class="ok"><span class="dot"></span>在线</span><span class="muted">${28+(n%73)} ms</span></div>`}rows.innerHTML=h}viewport.addEventListener('scroll',()=>requestAnimationFrame(render),{passive:true});addEventListener('resize',render);render();
const conn=document.querySelector('#conn'),tick=document.querySelector('#tick');function ws(){const p=location.protocol==='https:'?'wss':'ws';const s=new WebSocket(`${p}://${location.host}/ws/status`);s.onopen=()=>{conn.innerHTML='<span class="dot"></span>WS 实时心跳';conn.className='ok'};s.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='heartbeat')tick.textContent='最近心跳 '+new Date(m.ts*1000).toLocaleTimeString()}catch{}};s.onclose=()=>{conn.textContent='WS 重连等待';conn.className='warn';setTimeout(ws,2000)};s.onerror=()=>s.close()}ws();fetch('/api/v1/meta').then(r=>r.json()).then(m=>{document.querySelector('#db').textContent=m.database_mode==='mysql-shadow'?'MySQL 影子读模型':'影子未接管'}).catch(()=>{});
})();
</script></body></html>
